name: 🐞 Report a bug
description: Report a reproducible problem in OpenWorking
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Please do not report security vulnerabilities in a public issue**. Follow the [security policy](https://github.com/BlockCTech/openworking/blob/main/SECURITY.md) to report security issues privately.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing [OpenWorking issues](https://github.com/BlockCTech/openworking/issues) and have not found a suitable solution or duplicate report.
          required: true
        - label: I have read the [contributing guidelines](https://github.com/BlockCTech/openworking/blob/main/CONTRIBUTING.md) and will follow them.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the issue, including what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Detail the steps taken to reproduce this error, and whether this issue can be reproduced consistently or if it is intermittent.
      placeholder: |
        1. Step 1...
        2. Step 2...
        3. ...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, screenshots, environment details, or any other relevant information.
    validations:
      required: false
