name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed installers to a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing or new release tag (defaults to v<package version>)
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        name: Validate release version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag="${REQUESTED_TAG:-v$version}"
            publish="${REQUESTED_PUBLISH:-false}"
          fi
          if [[ "${tag#v}" != "$version" ]]; then
            echo "Tag $tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    environment: windows-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build, sign, verify and checksum installer
        run: npm run dist:win -- --arch=${{ matrix.arch }}

      - name: Smoke install, upgrade and uninstall
        run: npm run smoke:installer:win -- --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWorking-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/OpenWorking-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.exe
            dist/OpenWorking-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.exe.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenWorking-${{ needs.prepare.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null || true)"
          if [[ -n "$tag_sha" && "$tag_sha" != "$BUILD_SHA" ]]; then
            echo "Tag $RELEASE_TAG points to $tag_sha, but the installers were built from $BUILD_SHA" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ -z "$tag_sha" ]]; then
              echo "Release $RELEASE_TAG exists without a resolvable tag" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif [[ -n "$tag_sha" ]]; then
            gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
          else
            gh release create "$RELEASE_TAG" dist/* --generate-notes --target "$BUILD_SHA"
          fi
